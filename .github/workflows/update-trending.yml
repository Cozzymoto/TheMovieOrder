name: Update trending franchises

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday, 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only. Type true to change nothing.'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rank franchises by this week's TMDB trending films
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/update-trending.mjs
      - name: Commit the new trending list
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change to the trending list this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trending.json
          git commit -m "Update trending franchises from TMDB"
          git push
